<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Selectable — Demo</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
      }
      /* layout lives on <main> so the page has a proper landmark (axe: region) */
      main {
        max-width: 860px;
        margin: 3rem auto;
        padding: 0 1rem;
        display: grid;
        gap: 2rem;
      }
      section { display: grid; gap: 0.5rem; }
      label { font-weight: 600; font-size: 14px; }
      .row { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; }
      .dark-zone { background: #16181c; padding: 1.5rem; border-radius: 12px; }
      .dark-zone label { color: #e6e8eb; }
      .overflow-trap {
        overflow: hidden; height: 120px; border: 1px dashed #ccc;
        padding: 1rem; border-radius: 8px;
      }
      output { font-size: 13px; color: #667085; }
    </style>
  </head>
  <body>
    <main>
    <h1>Selectable</h1>

    <div class="row">
      <section>
        <label for="basic">Tekli — az seçenek (aramasız)</label>
        <select id="basic" name="karakter">
          <option value="">Karakter seçiniz…</option>
          <option value="jill">Jill Valentine</option>
          <option value="chris">Chris Redfield</option>
          <option value="leon">Leon S. Kennedy</option>
          <option value="barry" disabled>Barry Burton (disabled)</option>
          <option value="claire">Claire Redfield</option>
        </select>
        <output id="basic-out"></output>
      </section>

      <section>
        <label for="grouped">Tekli — gruplu + aramalı</label>
        <select id="grouped" name="konum">
          <option value="">Konum seçiniz…</option>
          <optgroup label="Raccoon City">
            <option value="rpd">R.P.D. Merkezi</option>
            <option value="can-kulesi">Çan Kulesi</option>
            <option value="hastane">Hastane</option>
            <option value="isik-kulesi">Işık Kulesi</option>
            <option value="nest">NEST Laboratuvarı</option>
          </optgroup>
          <optgroup label="Arklay Dağları">
            <option value="spencer">Spencer Malikanesi</option>
            <option value="nobetci">Nöbetçi Kulübesi</option>
            <option value="egitim">Eğitim Tesisi</option>
          </optgroup>
          <optgroup label="Avrupa">
            <option value="dimitrescu">Dimitrescu Kalesi</option>
            <option value="koy-meydani">Köy Meydanı</option>
            <option value="salazar">Salazar Kalesi</option>
          </optgroup>
        </select>
      </section>

      <section>
        <label for="multi">Çoklu — chip'ler (wrap)</label>
        <select id="multi" name="envanter" multiple>
          <option value="yesil-ot" selected>Yeşil Ot</option>
          <option value="mavi-ot" selected>Mavi Ot</option>
          <option value="kirmizi-ot">Kırmızı Ot</option>
          <option value="ilk-yardim">İlk Yardım Spreyi</option>
          <option value="murekkep-seridi">Mürekkep Şeridi</option>
          <option value="maymuncuk">Maymuncuk</option>
          <option value="depo-anahtari">Depo Anahtarı</option>
          <option value="daktilo-seridi">Daktilo Şeridi</option>
          <option value="sifali-karisim">Şifalı Bitki Karışımı</option>
        </select>
        <output id="multi-out"></output>
      </section>

      <section>
        <label for="grouped-multi">Çoklu — gruplu + tümünü seç (grup toggle)</label>
        <select id="grouped-multi" name="konumlar" multiple>
          <optgroup label="Raccoon City">
            <option value="rpd">R.P.D. Merkezi</option>
            <option value="can-kulesi">Çan Kulesi</option>
            <option value="hastane">Hastane</option>
          </optgroup>
          <optgroup label="Arklay Dağları">
            <option value="spencer">Spencer Malikanesi</option>
            <option value="nobetci">Nöbetçi Kulübesi</option>
          </optgroup>
          <optgroup label="Avrupa">
            <option value="dimitrescu">Dimitrescu Kalesi</option>
            <option value="koy-meydani">Köy Meydanı</option>
          </optgroup>
        </select>
      </section>

      <section>
        <label for="multi-counter">Çoklu — +N counter, max 5</label>
        <select id="multi-counter" multiple>
          <option value="1" selected>Jill Valentine</option>
          <option value="2" selected>Chris Redfield</option>
          <option value="3" selected>Barry Burton</option>
          <option value="4">Rebecca Chambers</option>
          <option value="5">Brad Vickers</option>
          <option value="6">Carlos Oliveira</option>
          <option value="7">Sherry Birkin</option>
        </select>
      </section>

      <section>
        <label for="big">10.000 seçenek — sanal liste</label>
        <select id="big"></select>
      </section>

      <section class="overflow-trap">
        <label for="trapped">overflow:hidden tuzağı içinde</label>
        <select id="trapped">
          <option value="">Seç…</option>
          <option value="a">Panel bu kutudan taşabilmeli</option>
          <option value="b">Çünkü top-layer'dayız</option>
          <option value="c">z-index savaşı yok</option>
        </select>
      </section>

      <section>
        <label for="tagged">Tagging — yaz ve oluştur</label>
        <select id="tagged" name="etiketler" multiple>
          <option value="yesil-ot" selected>Yeşil Ot</option>
          <option value="ilk-yardim">İlk Yardım Spreyi</option>
        </select>
      </section>

      <section>
        <label for="remote">Remote — async arama + sayfalama (sahte API, 100 kayıt, sayfa başı 20, 400ms)</label>
        <select id="remote" name="personel"></select>
        <output id="remote-out"></output>
      </section>

      <section>
        <label for="veto">Veto — beforeChange / beforeClose (tekli, aramasız)</label>
        <select id="veto" name="veto">
          <option value="">Seçiniz…</option>
          <option value="ada">Ada Wong</option>
          <option value="forbidden">Albert Wesker</option>
          <option value="hunk">HUNK</option>
        </select>
        <label><input type="checkbox" id="veto-lock" /> panel kilitli</label>
        <output id="veto-out"></output>
      </section>

      <section id="gorev-akisi">
        <label for="bolge">Görev akışı — bölge → tesis → oda (next zinciri)</label>
        <select id="bolge" name="bolge">
          <option value="">Bölge seçiniz…</option>
          <option value="rc">Raccoon City</option>
          <option value="arklay">Arklay Dağları</option>
          <option value="avrupa">Avrupa</option>
        </select>
        <label for="tesis">Tesis</label>
        <select id="tesis" name="tesis">
          <option value="">Tesis seçiniz…</option>
        </select>
        <label for="oda">Oda</label>
        <select id="oda" name="oda">
          <option value="">Oda seçiniz…</option>
        </select>
        <div><button type="button" id="gorev-start">Akışı başlat</button></div>
        <output id="gorev-out"></output>
      </section>

      <section>
        <label for="subtext">Subtext + görsel — tekli, aramalı (60 kayıt, sanal)</label>
        <select id="subtext" name="kisi">
          <option value="">Kişi seçiniz…</option>
          <option value="jill"
                  data-image="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 20 20'%3E%3Crect width='20' height='20' fill='%233d63dd'/%3E%3Ccircle cx='10' cy='8' r='3.5' fill='%23fff'/%3E%3Cpath d='M3.5 18a6.5 6.5 0 0113 0z' fill='%23fff'/%3E%3C/svg%3E"
                  data-subtext="S.T.A.R.S. Alpha, Artçı Güvenlik — hem görsel hem subtext">Jill Valentine</option>
          <option value="chris"
                  data-image="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 20 20'%3E%3Crect width='20' height='20' fill='%230e9f6e'/%3E%3Ccircle cx='10' cy='8' r='3.5' fill='%23fff'/%3E%3Cpath d='M3.5 18a6.5 6.5 0 0113 0z' fill='%23fff'/%3E%3C/svg%3E">Chris Redfield (yalnız görsel)</option>
          <option value="leon" data-subtext="R.P.D. Aday Memuru">Leon S. Kennedy</option>
          <option value="claire" data-subtext="Sivil Arama Kurtarma">Claire Redfield</option>
        </select>
        <output id="subtext-out"></output>
      </section>
    </div>

    <div class="dark-zone">
      <section>
        <label for="dark">Koyu tema</label>
        <select id="dark" multiple>
          <option value="1" selected>Gece modu</option>
          <option value="2">Sistem</option>
          <option value="3">Aydınlık</option>
        </select>
      </section>
    </div>

    <form id="form-test">
      <section>
        <label for="formsel">Form entegrasyonu (reset dener)</label>
        <select id="formsel" name="malzeme">
          <option value="">Malzeme…</option>
          <option value="yesil-ot" selected>Yeşil Ot</option>
          <option value="kirmizi-ot">Kırmızı Ot</option>
        </select>
        <div><button type="reset">Formu Sıfırla</button></div>
      </section>
    </form>
    </main>

    <script type="module">
      import "@/styles/tokens.css";
      import "@/styles/selectable.css";
      import { Selectable, asyncSource, tr } from "@/index.ts";

      const basic = new Selectable("#basic", { i18n: tr, clearable: true });
      basic.on("change", ({ value, options }) => {
        document.getElementById("basic-out").textContent =
          `değer: ${value.join(", ") || "—"} (${options.map(o => o.label).join(", ")})`;
      });

      new Selectable("#grouped", { i18n: tr, search: true });

      const multi = new Selectable("#multi", { i18n: tr, clearable: true, selectAll: true });
      multi.on("change", ({ value }) => {
        document.getElementById("multi-out").textContent = `değer: [${value.join(", ")}]`;
      });

      new Selectable("#grouped-multi", {
        i18n: tr,
        search: true,
        selectAll: { groups: true },
      });

      new Selectable("#multi-counter", {
        i18n: tr, overflow: "counter", maxSelections: 5, search: true,
      });

      const big = document.getElementById("big");
      const frag = document.createDocumentFragment();
      const ph = document.createElement("option");
      ph.value = ""; ph.textContent = "Denek seçiniz…";
      frag.appendChild(ph);
      for (let i = 1; i <= 10000; i++) {
        const o = document.createElement("option");
        o.value = String(i);
        o.textContent = `Denek #${i.toString().padStart(5, "0")}`;
        frag.appendChild(o);
      }
      big.appendChild(frag);
      new Selectable(big, { i18n: tr, search: true, clearable: true });

      new Selectable("#trapped", { i18n: tr });
      new Selectable("#dark", { i18n: tr, theme: "dark" });
      new Selectable("#formsel", { i18n: tr });

      new Selectable("#tagged", { i18n: tr, tags: true });

      // 100 sahte personel kaydı: ilk 10'u isimli, kalanı "Personel NNN" — sayfalı API.
      const personeller = ["Jill Valentine", "Chris Redfield", "Leon S. Kennedy", "Claire Redfield",
        "Ada Wong", "Barry Burton", "Rebecca Chambers", "Brad Vickers",
        "Carlos Oliveira", "Grace Ashcroft"];
      for (let i = 11; i <= 100; i++) personeller.push(`Personel ${String(i).padStart(3, "0")}`);
      const PAGE_SIZE = 20;
      const remote = new Selectable("#remote", {
        i18n: tr,
        clearable: true,
        source: asyncSource(async (q, { page, signal }) => {
          await new Promise((r, j) => {
            const t = setTimeout(r, 400);
            signal.addEventListener("abort", () => { clearTimeout(t); j(new DOMException("Aborted", "AbortError")); });
          });
          const hits = personeller
            .map((u, i) => ({ value: `u${i}`, label: u }))
            .filter((o) => o.label.toLocaleLowerCase("tr").includes(q.toLocaleLowerCase("tr")));
          const start = page * PAGE_SIZE;
          return {
            options: hits.slice(start, start + PAGE_SIZE),
            hasMore: start + PAGE_SIZE < hits.length,
          };
        }, { cacheSize: 0 }),
      });
      remote.on("change", ({ options }) => {
        document.getElementById("remote-out").textContent =
          options.map((o) => o.label).join(", ") || "—";
      });

      // Veto fixture: beforeChange "forbidden"ı reddeder; beforeClose kilit
      // işaretliyken paneli açık tutar (destroy/disable yine de kapatır).
      const veto = new Selectable("#veto", { i18n: tr });
      veto.on("beforeChange", (e) => {
        if (e.next.includes("forbidden")) e.preventDefault();
      });
      veto.on("beforeClose", (e) => {
        if (document.getElementById("veto-lock").checked) e.preventDefault();
      });
      veto.on("change", ({ value }) => {
        document.getElementById("veto-out").textContent =
          `değer: ${value.join(", ") || "—"}`;
      });

      // Görev akışı: bölge → tesis → oda `next` zinciri. Bir seçim paneli
      // kapattığında sıradaki select otomatik açılır; change handler'ları
      // (bağımlı seçenek yükleme) SONRAKİ panel açılmadan ÖNCE koşar.
      // Not: `autofocus: true` bu akışı sayfa yüklenir yüklenmez başlatırdı
      // (bölge paneli otomatik açılıp klavyeyi yakalar) — demo ziyaretçisini
      // rahatsız etmemek için burada kapalı; onun yerine "Akışı başlat"
      // butonu bolge.open() ile tetikliyor.
      const tesisler = {
        "rc": [
          { value: "rpd", label: "R.P.D. Merkezi" },
          { value: "can-kulesi", label: "Çan Kulesi" },
          { value: "hastane", label: "Hastane" },
        ],
        "arklay": [
          { value: "spencer", label: "Spencer Malikanesi" },
          { value: "nobetci", label: "Nöbetçi Kulübesi" },
          { value: "egitim", label: "Eğitim Tesisi" },
        ],
        "avrupa": [
          { value: "dimitrescu", label: "Dimitrescu Kalesi" },
          { value: "koy-meydani", label: "Köy Meydanı" },
          { value: "salazar", label: "Salazar Kalesi" },
        ],
      };
      const bolge = new Selectable("#bolge", { i18n: tr, search: true, next: "#tesis" });
      const tesis = new Selectable("#tesis", { i18n: tr, next: "#oda" });
      const oda = new Selectable("#oda", { i18n: tr });
      bolge.on("change", ({ value }) => {
        tesis.setValue([], { silent: true });
        oda.setValue([], { silent: true });
        oda.setOptions([]);
        tesis.setOptions(tesisler[value[0]] ?? []);
      });
      tesis.on("change", ({ value, options }) => {
        oda.setValue([], { silent: true });
        oda.setOptions(
          (options[0] ? [1, 2, 3] : []).map((i) => ({
            value: `${value[0]}-oda${i}`,
            label: `${options[0].label} Oda ${i}`,
          })),
        );
      });
      oda.on("change", () => {
        document.getElementById("gorev-out").textContent =
          [bolge, tesis, oda]
            .map((s) => s.getSelectedOptions()[0]?.label ?? "—")
            .join(" / ");
      });
      document.getElementById("gorev-start")
        .addEventListener("click", () => bolge.open());

      // Subtext fixture'ını 60 kayda tamamla (sanal liste + tek tip satır
      // yüksekliği kontrolü). data-subtext'li native option'lar otomatik
      // olarak option.subtext alanına terfi eder.
      const subtextSelect = document.getElementById("subtext");
      for (let i = 1; i <= 56; i++) {
        const o = document.createElement("option");
        o.value = `personel-${i}`;
        o.textContent = `Personel ${String(i).padStart(2, "0")}`;
        o.dataset.subtext = `personel${i}@ornek.com`;
        subtextSelect.appendChild(o);
      }
      const subtext = new Selectable("#subtext", {
        i18n: tr,
        search: true,
        clearable: true,
      });
      subtext.on("change", ({ options }) => {
        document.getElementById("subtext-out").textContent =
          options.map((o) => `${o.label} (${o.subtext ?? "subtext yok"})`).join(", ") || "—";
      });
    </script>
  </body>
</html>
